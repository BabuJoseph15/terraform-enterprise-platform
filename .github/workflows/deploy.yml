name: Deploy to ECS

on:
  push:
    branches:
      - master

  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-2
  AWS_ACCOUNT_ID: 774055931904
  ECR_REPOSITORY: enterprise-platform-dev
  ECS_CLUSTER: enterprise-platform-dev-cluster
  ECS_SERVICE: enterprise-platform-dev-service

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set Image Tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::774055931904:role/enterprise-platform-dev-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build \
          -t ${ECR_REPOSITORY}:${IMAGE_TAG} \
          ./applications/hello-app

      - name: Tag Docker Image
        run: |
          docker tag \
          ${ECR_REPOSITORY}:${IMAGE_TAG} \
          ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}

      - name: Push Docker Image to ECR
        run: |
          docker push \
          ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}

      - name: Force New ECS Deployment
        run: |
          aws ecs update-service \
          --cluster ${ECS_CLUSTER} \
          --service ${ECS_SERVICE} \
          --force-new-deployment

      - name: Wait For ECS Service Stability
        run: |
          aws ecs wait services-stable \
          --cluster ${ECS_CLUSTER} \
          --services ${ECS_SERVICE}

      - name: Show Deployment Status
        run: |
          aws ecs describe-services \
          --cluster ${ECS_CLUSTER} \
          --services ${ECS_SERVICE}

      - name: Deployment Complete
        run: |
          echo "Deployment completed successfully."
